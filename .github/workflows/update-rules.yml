name: Update Loon ad rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

concurrency:
  group: update-loon-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build combined list
        run: python update_rules.py
      - name: Commit updated list
        run: |
          git add AdBlock.list AdBlock-Extended.list rules/
          if git diff --cached --quiet -- AdBlock.list AdBlock-Extended.list rules/; then
            echo "No rule changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: update Loon ad rules"
          git pull --rebase origin main
          git push
